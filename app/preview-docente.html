<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel docente - datos de prueba</title></head>
<body>
<div id="gnf-docente-root"></div>
<script type="module">
  import logoUrl from '../assets/logo-guardiana.png';
  const assigned = new URLSearchParams(location.search).has('assigned');
  const empty = new URLSearchParams(location.search).has('empty');
  const paused = new URLSearchParams(location.search).has('paused');
  window.__GNF_DOCENTE__ = {
    restUrl: '/mock-api', nonce: '', anio: 2026, selectedYear: 2026, availableYears: [2026], logoUrl: new URL(logoUrl, location.href).pathname,
    user: { id: 1, name: 'Docente de prueba', displayName: 'Docente de prueba', role: 'docente', roles: ['docente'], email: 'demo@example.org' },
    feedbackEnabled: false,
  };
  const retos = [
    ['AGUA', 'Fortalecer la educación y sensibilización de la comunidad educativa en torno al agua.', '#285f85', 95],
    ['ELECTRICIDAD', 'Promover buenas prácticas de ahorro energético en el centro educativo.', '#708324', 60],
    ['RESIDUOS', 'Impulsar un programa de gestión integral de residuos en el centro educativo.', '#9d315a', 80],
    ['ECO CLUBES ESTUDIANTILES', 'Promover la participación activa de los estudiantes en acciones educativas.', '#218077', 25],
    ['ECO LONCHERA', 'Promover alimentos frescos y recipientes reutilizables.', '#b65268', 45],
  ].map(([title, descripcion, color, puntajeMaximo], index) => ({
    id: index + 1, titulo: 'RETO ' + title, descripcion, color, puntajeMaximo, obligatorio: index < 3,
    entry: { id: index + 1, retoId: index + 1, estado: 'en_progreso', puntaje: index === 0 ? 35 : 15, evidencias: [], createdAt: '2026-09-16', updatedAt: '2026-09-16' },
  }));
  const notifications = ['rechazada', 'en_pausa', 'en_pausa'].map((estado, index) => ({
    id: index + 1, tipo: estado === 'en_pausa' ? 'evidencia_en_pausa' : 'evidencia_rechazada',
    mensaje: estado === 'en_pausa' ? 'La evidencia del mural se encuentra en pausa. Falta el mural terminado.' : 'La evidencia del reto Agua no corresponde a la actividad.',
    leido: index === 2, createdAt: '2026-09-25 09:00:00', entryId: index + 1,
    actionLabel: 'Abrir reto', actionTarget: { page: 'formularios', params: { reto_id: '1' } },
    centroNombre: 'CENTRO EDUCATIVO DE PRUEBA', retoTitulo: 'RETO ECO MURAL', regionName: 'NICOYA', circuito: '01',
    evidenceItems: [{ evidenceIndex: 0, estado, questionLabel: 'Fotografía del mural terminado',
      fileName: 'mural.jpg', previewUrl: new URL(logoUrl, location.href).pathname, isImage: true,
      reviewReason: estado === 'en_pausa' ? 'reto_inconcluso' : 'no_corresponde',
      supervisorComment: 'Adjunta una fotografía donde se vea el mural terminado.', reviewedBy: 2, reviewedByName: 'Supervisión', reviewedAt: '2026-09-25 09:00:00' }],
  }));
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (input, options) => {
    const url = new URL(String(input), location.origin);
    if (!url.pathname.startsWith('/mock-api')) return nativeFetch(input, options);
    let payload = { success: true };
    if (url.pathname.endsWith('/docente/dashboard')) payload = {
      centro: { id: 1, nombre: 'CENTRO EDUCATIVO DE PRUEBA', codigoMep: '0000', regionName: 'NICOYA' },
      docenteEstado: 'activo', tieneMatricula: true, retosCount: 5, puntajeTotal: empty ? 0 : 95,
      aprobados: 1, enviados: 2, correccion: 1, enProgreso: 1,
      evidenceCounts: empty ? { pending: 0, approved: 0, rejected: 0, paused: 0, total: 0 } : { pending: 8, approved: 24, rejected: 3, paused: paused ? 2 : 0, total: paused ? 37 : 35 },
      assignedAward: assigned ? { result: { stars: 3 }, assignedAt: '2026-09-16', assignedBy: 2 } : null,
      reportPdfStatus: assigned ? 'final' : 'draft', reportPdfUrl: assigned ? '#reporte-final-prueba' : '',
    };
    else if (url.pathname.endsWith('/docente/retos')) payload = retos;
    else if (url.pathname.endsWith('/notifications')) payload = notifications;
    else if (url.pathname.endsWith('/read')) { const id = Number(url.pathname.split('/').at(-2)); const item = notifications.find(n => n.id === id); if (item) item.leido = true; }
    else if (url.pathname.endsWith('/read-all')) notifications.forEach(item => { item.leido = true; });
    else if (url.pathname.endsWith('/docente/wizard')) payload = retos.map(reto => ({ retoId: reto.id, retoTitulo: reto.titulo, retoColor: reto.color, formId: 10, estado: 'en_progreso', puntaje: 15, puntajeMaximo: reto.puntajeMaximo }));
    else if (url.pathname.endsWith('/form-html')) payload = {
      formId: 10, reto: retos[0], entry: paused ? { ...retos[0].entry, evidencias: [{ field_id: 1, nombre: 'actividad.jpg', url: new URL(logoUrl, location.href).pathname, tipo: 'imagen', puntos: 5, estado: 'en_pausa', review_reason: 'subir_requisito', supervisor_comment: 'Falta la evidencia de cierre.' }] } : null, savedValues: {}, conditionalRules: [],
      fieldPoints: [{ fieldId: 1, label: 'REQUISITO - Fotografía de los estudiantes durante la actividad educativa.', puntos: 5, tipo: 'file-upload' }],
      requiredEvidenceFieldIds: [1],
      html: '<div class="wpforms-container"><form id="wpforms-form-10"><div id="wpforms-10-field_1-container" class="wpforms-field wpforms-field-file-upload" data-field-id="1"><label for="wpforms-10-field_1">REQUISITO - Fotografía de los estudiantes durante la actividad educativa.</label><input id="wpforms-10-field_1" type="file" name="wpforms[fields][1]"></div><div id="wpforms-10-field_2-container" class="wpforms-field"><label for="wpforms-10-field_2">Comentario opcional</label><input id="wpforms-10-field_2" name="wpforms[fields][2]"></div></form></div>',
    };
    return new Response(JSON.stringify(payload), { status: 200, headers: { 'Content-Type': 'application/json' } });
  };
  await import('/src/entries/docente.tsx');
</script>
</body>
</html>
